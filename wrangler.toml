name = "radamantis"
main = "src/index.ts"
compatibility_date = "2026-08-01"

# Etapa 1-4 — secrets (NO van en este archivo; usar `wrangler secret put <NOMBRE>` en prod,
# y un archivo `.dev.vars` local — ya está en .gitignore — para `wrangler dev`):
#   TELEGRAM_WEBHOOK_SECRET  — string aleatorio propio; valida el header
#                              X-Telegram-Bot-Api-Secret-Token en cada request (compartido
#                              entre todos los bots/tenants, no es sensible por tenant)
#   OPENAI_API_KEY           — API key de OpenAI con billing activo (no la sub. ChatGPT Plus/Pro)
#   ADMIN_API_KEY            — key de super-admin para /api/admin/* y el dashboard (/admin).
#                              D10: nunca Basic Auth. Un solo operador hoy (Oscar); JWT/API-key
#                              por tenant y Cloudflare Access para super-admin quedan pendientes
#                              de endurecer (ver nota de seguridad en CLAUDE.md, Etapa 8).
#   GOOGLE_OAUTH_CLIENT_ID       — Etapa 10 (booking real): app OAuth de Radamantis en Google
#   GOOGLE_OAUTH_CLIENT_SECRET     Cloud Console (Calendar API). Una sola app compartida; cada
#                                  tenant autoriza SU PROPIO calendario individualmente — los
#                                  tokens resultantes viven en D1 (calendar_connections), no aquí.
#   CLIENT_SESSION_SECRET        — Etapa 10 (consola del cliente, D10): firma los tokens de
#                                  sesión de /api/client/* (src/client/session.ts). Un solo
#                                  secret compartido para firmar/verificar — las contraseñas
#                                  de cada tenant_user viven en D1, hasheadas (src/client/passwords.ts).
#   CLOUDFLARE_API_TOKEN         — Agencia ("widgets de costo real en /admin", parte Cloudflare):
#                                  API Token propio (Account Analytics Read) para consultar la
#                                  GraphQL Analytics API de Cloudflare y estimar el costo real de
#                                  Workers/D1/Durable Objects/Vectorize. account_id NO es secreto,
#                                  va en [vars] abajo.
#
# Nota conectores Facebook/Instagram (Agencia): App ID/App Secret/Verify Token de
# Meta NO son secrets de Worker — a pedido explícito de Oscar ("no te lo voy a
# pedir directamente, debe ser fácil"), viven en D1 (tabla platform_settings,
# migración 0026, src/platformSettings.ts) y se editan desde la pestaña
# "Plataforma" del panel (/admin), sin `wrangler secret put`. Mismo nivel de
# seguridad "sandbox" ya aceptado en el proyecto para otros tokens en D1 (bot
# tokens de Telegram, Page Access Tokens, refresh tokens de Google Calendar).
#
# Nota Etapa 4: el token de cada bot de Telegram YA NO es un secret de Worker.
# Vive en la tabla channel_bindings (D1) — alta de canal = INSERT, no
# `wrangler secret put` ni deploy (D8). El token llega en la URL del webhook
# (`/webhook/telegram/:botToken`, patrón recomendado por Telegram) y sirve a
# la vez para resolver el tenant y para llamar a la API de Telegram.

# Agencia ("widgets de costo real en /admin", parte Cloudflare): account_id
# no es un secreto (es visible en cualquier dashboard de Cloudflare de Oscar),
# así que vive en texto plano aquí en vez de como wrangler secret.
[vars]
CLOUDFLARE_ACCOUNT_ID = "cfc24686341fce4a626f661c6a265402"

# Etapa 2-4 — D1: usage_log (costos), messages (memoria) y tenants/channel_bindings (D2/D3).
[[d1_databases]]
binding = "DB"
database_name = "radamantis"
database_id = "37fd29a1-ddc2-4aa4-ab16-4d44648d0abb"

# Etapa 3 — un Durable Object por conversación (tenantId:channel:chatId), D2/D1.
[[durable_objects.bindings]]
name = "AGENT"
class_name = "ConversationAgent"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["ConversationAgent"]

# Etapa 5 — RAG. Vectorize tiene tier gratuito en Workers Free (30M dimensiones
# consultadas/mes, 5M almacenadas) — no requiere Workers Paid para este KB pequeño.
# D4: un índice compartido, filtrado por metadata { tenant_id, doc_id } por query.
[[vectorize]]
binding = "VECTORIZE"
index_name = "radamantis-kb"

# Etapa 10 (superpower "Recupera no-shows"): barrido cada 30 min de citas
# vencidas sin seguimiento (src/noShowSweep.ts). También se puede disparar
# a mano vía POST /api/admin/no-show-sweep para probar sin esperar al cron.
[triggers]
crons = ["*/30 * * * *"]

